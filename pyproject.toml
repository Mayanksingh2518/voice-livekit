[project]
name = "voice-livekit"
version = "0.1.0"
description = "Outbound healthcare voice agent on LiveKit with Opik observability"
requires-python = ">=3.11,<3.13"

# The base install is what the web console needs: serve a page, mint LiveKit tokens, read Opik.
# The agent's speech stack is heavy (onnxruntime, VAD and turn-detector weights) and belongs
# only where the agent actually runs — see the `agent` extra.
dependencies = [
    "livekit-api~=1.0",
    "opik>=2.2",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "aiohttp>=3.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
agent = [
    "livekit-agents[cartesia,deepgram,openai,silero,turn-detector]~=1.8",
    "livekit-plugins-noise-cancellation~=0.2",
    "openai>=1.40",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

# Without this, setuptools refuses to build: it finds several top-level directories and cannot
# guess which are packages. `data` and `web` are not importable packages and stay out.
[tool.setuptools]
packages = ["agent", "analysis", "observability", "services"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
