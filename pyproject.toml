[project]
name = "voice-livekit"
version = "0.1.0"
description = "Outbound healthcare voice agent on LiveKit with Opik observability"
requires-python = ">=3.11,<3.13"
dependencies = [
    "livekit-agents[cartesia,deepgram,openai,silero,turn-detector]~=1.8",
    "livekit-plugins-noise-cancellation~=0.2",
    "opik>=2.2",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "boto3>=1.34",
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
